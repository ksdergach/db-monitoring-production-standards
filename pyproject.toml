[project]
name = "db-monitoring"
version = "0.1.0"
description = "Система мониторинга данных в БД"
requires-python = ">=3.12,<3.14"
dependencies = [
    "APScheduler==3.11.2",
    "Faker==40.14.0",
    "Flask==3.1.3",
    "joblib==1.5.3",
    "prophet==1.3.0",
    "psycopg2-binary==2.9.11",
    "PyMySQL==1.1.1",
    "clickhouse-sqlalchemy==0.3.2",
    "pydantic==2.13.2",
    "ruptures==1.1.9",
    "scikit-learn==1.6.1",
    "pydantic-settings==2.13.1",
    "SQLAlchemy==2.0.49",
    "Werkzeug==3.1.8",
    "httpx==0.28.1",
    "tenacity==9.1.2",
    "python-telegram-bot==22.7",

    # Imported directly by the code, but used to arrive only as transitive
    # dependencies (of prophet, scikit-learn, Flask-WTF, clickhouse-sqlalchemy).
    "numpy==2.5.3",
    "pandas==3.0.6",
    "WTForms==3.2.2",
    "clickhouse-driver==0.2.11",

    # Auth (#49) — email/пароль регистрация и логин с серверными сессиями.
    # Flask-WTF — CSRF на формах, email-validator — формат email.
    "Flask-Login==0.6.3",
    "Flask-WTF==1.2.1",
    "email-validator==2.2.0",

    # DB connections с Fernet-шифрованием DSN (#51). cryptography уже частая
    # транзитивная зависимость; явно фиксируем.
    "cryptography==44.0.0",

    # Security hygiene (#56) — rate-limit auth endpoints to slow down brute-force.
    # In-memory storage by default; can switch to Redis via FLASK_LIMITER_STORAGE_URI.
    "Flask-Limiter==3.8.0",

    # Apache Iceberg adapter (#111). pyarrow extra brings PyArrow (S3 file I/O);
    # glue extra brings boto3 for AWS Glue catalog. Both catalog backends are
    # supported: iceberg+rest:// (REST catalog) and iceberg+glue:// (AWS Glue).
    # Note: in pyiceberg >=0.7 the old [s3] extra was renamed to [pyarrow].
    "pyiceberg[pyarrow,glue]>=0.7.0,<1.0.0",

    # Prometheus instrumentation (#101). Counter/Histogram primitives + the
    # standard text exposition format consumed by Grafana / VictoriaMetrics /
    # any Prometheus-compatible scraper.
    "prometheus-client>=0.20,<1.0",

    # Sentry error tracking (#103). [flask] extra wires the FlaskIntegration
    # automatically — request context, breadcrumbs, exception capture. Init
    # is gated on SENTRY_DSN env var; empty DSN → SDK is a no-op (dev/CI).
    "sentry-sdk[flask]>=2.0,<3.0",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.0,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.4"
coverage = "7.13.5"
ruff = "0.9.4"
# E2E dashboard tests (#45) — headless Chromium drives the live Flask app.
# `pytest -m e2e` opts in. After install: `playwright install chromium`.
# Kept in the dev group: the e2e test modules import playwright at module
# level, so pytest cannot collect the test suite without it.
playwright = "1.50.0"
pytest-playwright = "0.7.0"

# Integration tests (#44, #124) — real DBs + Iceberg via Docker containers.
# `pytest -m integration` opts in; default test runs skip these.
# Install with `poetry install --with dev,integration`.
[tool.poetry.group.integration]
optional = true

[tool.poetry.group.integration.dependencies]
testcontainers = { version = "4.10.0", extras = ["postgres", "mysql", "clickhouse"] }
# boto3 is needed by the Iceberg integration test (#124) to create the MinIO bucket.
boto3 = ">=1.34.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run skips slow tests:
#   integration — testcontainers DBs (#44)
#   e2e        — Playwright + headless Chromium (#45)
# Opt in via `pytest -m integration` / `pytest -m e2e` (or the matching Make targets).
addopts = "-m 'not integration and not e2e'"
markers = [
    "integration: end-to-end tests that need a real DB container (slow)",
    "e2e: browser-driven dashboard tests via Playwright (slow)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["venv", "models", "monitor.db"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long — handled by formatter when it can; long strings/comments allowed
    "B008",   # function call in default arg (FastAPI/Flask patterns)
    "SIM108", # ternary vs if/else — readability is contextual
    "RUF001", # ambiguous unicode in strings — codebase intentionally uses Cyrillic
    "RUF002", # ambiguous unicode in docstrings — Russian docstrings/comments are by design
    "RUF003", # ambiguous unicode in comments — same
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]                # tests prioritize clarity over patterns
"scripts/**" = ["T201"]                  # print() is fine in scripts

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "collectors", "scripts", "api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
