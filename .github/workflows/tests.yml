name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies
        run: poetry sync --with dev

      - name: Verify Python version
        run: poetry run python -V

      - name: Run tests with coverage
        env:
          SECRET_KEY: test-secret
          DATABASE_URL: postgresql://test:test@localhost/test
        run: |
          poetry run coverage run -m pytest -v
          poetry run coverage report -m
          poetry run coverage xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # Integration tests (#44) — spin up real Postgres / MySQL / ClickHouse via
  # testcontainers. Run after merging to master or manually on a PR branch.
  integration:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies
        run: poetry sync --with dev,integration

      - name: Verify Python version
        run: poetry run python -V

      - name: Run integration tests
        env:
          SECRET_KEY: test-secret
          DATABASE_URL: postgresql://test:test@localhost/test
        run: poetry run pytest -m integration -v --tb=short

  # E2E dashboard tests (#45) — Playwright + headless Chromium drives the
  # live Flask app. Run after merging to master or manually on a PR branch.
  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Install dependencies
        run: poetry sync --with dev

      - name: Verify Python version
        run: poetry run python -V

      - name: Install Playwright browsers
        run: poetry run playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          SECRET_KEY: test-secret
          DATABASE_URL: postgresql://test:test@localhost/test
        run: poetry run pytest -m e2e -v --tb=short

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/_artifacts/
          if-no-files-found: ignore
          retention-days: 14

  environment:
    # Exercise onboarding and Docker from a fresh checkout with spaces/Cyrillic.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Свежий клон МО
    steps:
      - uses: actions/checkout@v4
        with:
          path: Свежий клон МО

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.1

      - name: Verify fresh installation
        run: |
          make install
          test "$(poetry env info --path)" = "$PWD/.venv"
          test -z "$(git status --porcelain)"
          cp .env.example .env
          make test-local

      - name: Build and start the application
        run: |
          make server > /tmp/dbm-server.log 2>&1 &
          for attempt in $(seq 1 180); do
            if curl --fail --silent http://localhost:5001/healthz; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/dbm-server.log
          exit 1

      - name: Test inside Docker
        run: make test ARGS="-q"

      - name: Record image size
        run: |
          docker image inspect db-monitoring --format 'Image: {{.Os}}/{{.Architecture}}, {{.Size}} bytes' >> "$GITHUB_STEP_SUMMARY"

      - name: Show container logs
        if: failure()
        run: |
          cat /tmp/dbm-server.log 2>/dev/null || true
          docker compose logs --tail=100

      - name: Stop validation containers
        if: always()
        run: docker compose down
