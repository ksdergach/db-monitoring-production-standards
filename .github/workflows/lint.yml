name: lint

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep in sync with the Poetry version in the first line of poetry.lock.
      - name: Install Poetry
        run: pipx install poetry==2.5.1

      # Ruff, mypy and pre-commit versions come from poetry.lock — local hooks
      # and CI use identical tools, so a green local run guarantees green CI.
      - name: Install dependencies
        run: poetry install --with dev

      - name: Run pre-commit
        run: poetry run pre-commit run --all-files --show-diff-on-failure
